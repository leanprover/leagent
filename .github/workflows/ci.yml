name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run redundant; matrix builds are not
# cheap here (each entry is a full from-scratch build of five packages).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Supported Lean versions. These are the toolchains the tools are expected to
    # compile and pass tests under; anything outside this list is unsupported
    # rather than merely untested.
    #
    # v4.28/v4.29 build and pass the full suite, but the two grind modes
    # (--grind-manifest, --grind-in-proof) refuse to run there: the used-lemma
    # data they collect was only exposed in v4.31.0. `grind` in the matrix below
    # records that expectation per entry. See lean-extract/Corpus/Compat.lean.
    #
    # No toolchain is selectable from the repo root: each of the five packages
    # carries its own lean-toolchain and the root has none. So each matrix entry
    # rewrites all five (via `make set-toolchain`) and then installs that
    # toolchain explicitly with `make toolchain`.
    #
    # This deliberately does NOT use `leanprover/lean-action`. That action runs
    # every step in one `lake-package-directory` (default `.`) and installs elan
    # with `--default-toolchain none`, then immediately runs `lean --version`
    # there — which fails with "no default toolchain configured" in a repo whose
    # root is not itself a lake package. Its `.lake` cache is also scoped to that
    # single directory, and we have four to cache and one that must NOT be cached
    # (see the cache step).
    # `slug` is the toolchain with `/` and `:` removed: those are not legal in a
    # cache key, and `matrix.toolchain` carries both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: leanprover/lean4:v4.28.0
            slug: v4.28.0
            grind: unsupported
          - toolchain: leanprover/lean4:v4.29.1
            slug: v4.29.1
            grind: unsupported
          - toolchain: leanprover/lean4:v4.31.0
            slug: v4.31.0
            grind: supported
          - toolchain: leanprover/lean4:v4.32.2
            slug: v4.32.2
            grind: supported

    name: build (${{ matrix.toolchain }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pin toolchain
        run: make set-toolchain TOOLCHAIN=${{ matrix.toolchain }}

      - name: Install elan
        run: |
          curl -sSfL \
            https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          # `--default-toolchain none` because the toolchain comes from each
          # package's lean-toolchain, not from a global default. Nothing runs
          # `lean` before `make toolchain` below, so there is no version to
          # resolve in between.
          ./elan-init -y --no-modify-path --default-toolchain none
          rm -f elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Fetch the pinned toolchain up front so a download failure is its own red
      # step rather than noise inside the first build.
      - name: Install Lean ${{ matrix.slug }}
        run: make toolchain

      # Cache the four build trees that are safe to reuse. reassemble/TestProject
      # is deliberately absent: the reassemble suite asserts that materialization
      # never creates a build tree in the fixture, so restoring one would fail the
      # suite. `make test` removes it before running for the same reason.
      #
      # The toolchain is part of every build trace, so it must be in the key or a
      # restored tree would be rebuilt wholesale anyway.
      - name: Cache build trees
        uses: actions/cache@v4
        with:
          path: |
            lean-extract/.lake
            workers/.lake
            reassemble/.lake
            examples/tree-project/.lake
          # Explicit paths rather than `**/`: a glob would also match the
          # lakefiles inside restored .lake/packages trees, making the key depend
          # on what the cache itself restored.
          key: lake-${{ runner.os }}-${{ matrix.slug }}-${{ hashFiles('lean-extract/lakefile.lean', 'workers/lakefile.lean', 'reassemble/lakefile.lean', 'examples/tree-project/lakefile.toml', 'lean-extract/lake-manifest.json', 'workers/lake-manifest.json', 'reassemble/lake-manifest.json', 'examples/tree-project/lake-manifest.json') }}-${{ github.sha }}
          # Falling back to an older tree is safe and usually a big win: lake
          # revalidates by content hash, so a stale artifact is rebuilt, not
          # trusted. The `github.sha` suffix on the primary key just means each
          # commit saves its own entry instead of colliding on a fixed key (which
          # `actions/cache` will not overwrite once written).
          restore-keys: |
            lake-${{ runner.os }}-${{ matrix.slug }}-${{ hashFiles('lean-extract/lakefile.lean', 'workers/lakefile.lean', 'reassemble/lakefile.lean', 'examples/tree-project/lakefile.toml', 'lean-extract/lake-manifest.json', 'workers/lake-manifest.json', 'reassemble/lake-manifest.json', 'examples/tree-project/lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ matrix.slug }}-

      - name: Build tools
        run: make all

      # Not covered by `make all`, which builds only the two binaries. The
      # extractor imports the target project's .oleans, so the example must be
      # built before the grind-gate step below can run against it.
      # reassemble/TestProject is deliberately NOT built: the reassemble suite
      # asserts that materialization never creates a build tree in the fixture.
      - name: Build example project
        run: make example

      - name: Run tests
        run: make test

      # The gate is only meaningful if it actually fires, and only in the
      # direction this entry expects. `--grind-manifest` needs --modules/--output
      # to parse, but the version check runs before any extraction work, so a
      # throwaway output dir is enough to reach it.
      - name: Check grind gate (${{ matrix.grind }})
        run: |
          set +e
          out=$(bin/lean_extract --modules Trees --output "$(mktemp -d)" \
                  --source-root examples/tree-project --grind-manifest 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -5
          # Match Corpus.grindUnsupportedMarker, not the prose around it. Grepping
          # a sentence is how this check first went wrong: it looked for "requires
          # Lean v4.31.0 or newer" against a message that says "require", so it
          # failed on the two toolchains where the gate was working correctly.
          marker="grind-unsupported-toolchain"
          if [ "${{ matrix.grind }}" = "unsupported" ]; then
            if [ $rc -eq 0 ]; then
              echo "::error::expected --grind-manifest to be refused on ${{ matrix.toolchain }}" >&2
              exit 1
            fi
            case "$out" in
              *"$marker"*) echo "refused as expected" ;;
              *) echo "::error::failed, but not with the version refusal" >&2; exit 1 ;;
            esac
          else
            if [ $rc -ne 0 ]; then
              echo "::error::--grind-manifest failed on ${{ matrix.toolchain }}, which supports it" >&2
              exit 1
            fi
            case "$out" in
              *"$marker"*)
                echo "::error::grind wrongly refused on ${{ matrix.toolchain }}" >&2; exit 1 ;;
              *) echo "gate correctly inactive" ;;
            esac
          fi

      # A stale fixture build tree fails the reassemble suite, and `make test`
      # removes it up front. If one exists here, materialization leaked into the
      # source tree — which is exactly what that suite asserts against.
      - name: Check fixture tree is clean
        run: |
          if [ -e reassemble/TestProject/.lake ]; then
            echo "::error::reassemble/TestProject/.lake exists after tests" >&2
            exit 1
          fi

      # The pin must not drift from the matrix; `git diff` here should only ever
      # show lean-toolchain files, and only for non-default entries.
      - name: Show toolchain diff
        if: always()
        run: git diff --stat
